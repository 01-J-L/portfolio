            </div>
        </div>
    </nav>

    <section class="page-section contact-section">
        <div class="container">
            <h2 class="page-title" data-aos="fade-down">Get In <span>Touch</span></h2>
            <div class="contact-content">
                <div class="contact-info" data-aos="fade-right" data-aos-delay="200">
                    <h3>Contact Information</h3>
                    <p><i class="fas fa-map-marker-alt"></i> Padre Garcia, Batangas, Philippines</p>
                    <p><i class="fas fa-envelope"></i> johnlesterolingay951827@gmail.com</p>
                    <p><i class="fas fa-phone"></i> 09668737749</p>
                    <div class="contact-social-links">
                        <a href="#" target="_blank"><i class="fa-brands fa-github"></i></a>
                        <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                        <a href="#" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                        <a href="#" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                    </div>
                </div>
                <form action="#" method="POST" class="contact-form" data-aos="fade-left" data-aos-delay="400">
                    <!-- For actual form submission, you'll need a backend or a service like Formspree -->
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="subject" placeholder="Subject" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </section>
