                    <div class="skill-bar">
                        <div class="skill-level" style="width: 85%;">85%</div>

                </div>

                    <div class="skill-bar">

                    <div class="skill-bar">

                    </div>

                    <div class="skill-bar">
                        <div class="skill-level" style="width: 60%;">60%</div>
                    </div>
                </div>

                    <div class="skill-bar">
